<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRコード高速照合システム ver1.7</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; text-align: center; background-color: #f4f7f6; margin: 0; }
    h2 { margin-top: 10px; font-size: 20px; }
    .ver-tag { font-size: 14px; color: #0066cc; font-weight: bold; margin-left: 6px; }
    #status { margin-bottom: 8px; font-weight: bold; color: #0066cc; line-height: 1.5; }
    
    .update-bar { margin-bottom: 15px; }
    .reload-btn { padding: 6px 14px; font-size: 13px; background-color: #17a2b8; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .reload-btn:disabled { background-color: #ccc; }
    
    #reader { width: 100%; max-width: 360px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; min-height: 250px; }
    
    .manual-input { margin-top: 20px; display: flex; justify-content: center; gap: 6px; max-width: 380px; margin-left: auto; margin-right: auto; }
    input[type="text"] { padding: 12px; flex: 1; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; min-width: 0; }
    button.search-btn { padding: 12px 14px; font-size: 15px; cursor: pointer; background: #0066cc; color: #fff; border: none; border-radius: 4px; font-weight: bold; white-space: nowrap; }
    button.clear-btn { padding: 12px 14px; font-size: 15px; cursor: pointer; background: #6c757d; color: #fff; border: none; border-radius: 4px; font-weight: bold; white-space: nowrap; }
    
    #result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none; max-width: 380px; margin-left: auto; margin-right: auto; text-align: left; position: relative; }
    
    .result-header { text-align: center; }
    .success-text { color: #5cb85c; font-size: 22px; font-weight: bold; margin-bottom: 10px; }
    .error { color: #d9534f; font-size: 20px; font-weight: bold; text-align: center; }

    .info-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .info-group:last-child { border-bottom: none; }
    .label { font-size: 12px; color: #666; font-weight: bold; }
    .value { font-size: 18px; font-weight: bold; color: #333; margin-top: 2px; word-break: break-all; }
    .value a { color: #0066cc; text-decoration: underline; }

    .box-clear-btn { display: block; width: 100%; margin-top: 15px; padding: 12px; font-size: 16px; font-weight: bold; color: #fff; background-color: #6c757d; border: none; border-radius: 6px; cursor: pointer; text-align: center; }
  </style>
</head>
<body>
  <h2>チケット照合システム <span class="ver-tag">ver 1.7</span></h2>
  
  <div id="status">⏳ データを読み込み中...</div>
  <div class="update-bar">
    <button id="forceUpdateBtn" class="reload-btn" onclick="forceUpdateData()" disabled>🔄 データを最新に更新</button>
  </div>

  <div id="reader"></div>

  <div class="manual-input">
    <input type="text" id="targetText" placeholder="QRデータを入力" onkeydown="if(event.key==='Enter') manualSearch()" disabled>
    <button id="searchBtn" class="search-btn" onclick="manualSearch()" disabled>検索</button>
    <button id="clearBtn" class="clear-btn" onclick="clearResult()" disabled>クリア</button>
  </div>
  
  <div id="result-box">
    <div id="result-msg" class="result-header"></div>
    
    <div id="result-details" style="display: none;">
      <div class="info-group">
        <div class="label">試合日 (B列)</div>
        <div class="value" id="res-date">-</div>
      </div>
      <div class="info-group">
        <div class="label">お客さまコード (D列)</div>
        <div class="value" id="res-code">-</div>
      </div>
      <div class="info-group">
        <div class="label">契約名義 (E列)</div>
        <div class="value" id="res-name">-</div>
      </div>
      <div class="info-group">
        <div class="label">担当者名 (F列)</div>
        <div class="value" id="res-staff">-</div>
      </div>
      <div class="info-group">
        <div class="label">9/27 (G列)</div>
        <div class="value" id="res-g">-</div>
      </div>
      <div class="info-group">
        <div class="label">9/29 (I列)</div>
        <div class="value" id="res-i">-</div>
      </div>
      <div class="info-group">
        <div class="label">10/3 (H列)</div>
        <div class="value" id="res-h">-</div>
      </div>
    </div>

    <button class="box-clear-btn" onclick="clearResult()">表示をクリア</button>
  </div>

  <script>
    const TSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTchepW59QeTUZfT1iY0SFhINTT305WxZ38kP1ud-iuK7dyHcRN3RZE-wmNTe3mEuGaqiARIfA6ZmDf/pub?gid=0&single=true&output=tsv";

    let dataMap = new Map();
    let html5Qrcode = null;

    // --- IndexedDB（ブラウザ保存用ヘルパー） ---
    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("QRCheckDB", 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("cacheStore")) {
            db.createObjectStore("cacheStore");
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function getSavedTsv() {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction("cacheStore", "readonly");
          const store = tx.objectStore("cacheStore");
          const req = store.get("tsvData");
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        console.error("Cache read error:", e);
        return null;
      }
    }

    async function saveTsv(data) {
      try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("cacheStore", "readwrite");
          const store = tx.objectStore("cacheStore");
          const req = store.put(data, "tsvData");
          req.onsuccess = () => resolve();
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (e) {
        console.error("Cache write error:", e);
      }
    }

    window.onload = async function() {
      try {
        // 保存データの確認
        let tsvText = await getSavedTsv();
        let isFromCache = false;

        if (tsvText) {
          isFromCache = true;
        } else {
          // キャッシュがなければGoogleからダウンロードして保存
          document.getElementById('status').innerText = "⏳ 初回データをダウンロード中...";
          const res = await fetch(TSV_URL);
          tsvText = await res.text();
          await saveTsv(tsvText);
        }

        parseAndSetupData(tsvText, isFromCache);

        document.getElementById('targetText').disabled = false;
        document.getElementById('searchBtn').disabled = false;
        document.getElementById('clearBtn').disabled = false;
        document.getElementById('forceUpdateBtn').disabled = false;

        startCamera();

      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = "❌ データの読み込みに失敗しました。";
      }
    };

    // TSVのパースと準備
    function parseAndSetupData(tsvText, isFromCache) {
      dataMap.clear();
      const lines = tsvText.split(/\r?\n/);
      
      let totalRows = lines.length - 1;
      let duplicateCount = 0;
      let emptyKeyCount = 0;

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split('\t');
        
        if (cols.length >= 1) {
          const key = String(cols[0]).trim();
          
          if (key !== "") {
            if (dataMap.has(key)) {
              duplicateCount++;
            }
            
            dataMap.set(key, { 
              date: cols[1] ? cols[1].trim() : "",        // B列：試合日
              code: cols[3] ? cols[3].trim() : "",        // D列：お客さまコード
              name: cols[4] ? cols[4].trim() : "",        // E列：契約名義
              staff: cols[5] ? cols[5].trim() : "",       // F列：担当者名
              gVal: cols[6] ? cols[6].trim() : "-",       // G列：9/27
              iVal: cols[8] ? cols[8].trim() : "-",       // I列：9/29
              hVal: cols[7] ? cols[7].trim() : "-"        // H列：10/3
            });
          } else {
            emptyKeyCount++;
          }
        }
      }

      const cacheTag = isFromCache 
        ? "<span style='color:#28a745;'>⚡ キャッシュ（保存データ）を使用中</span>" 
        : "<span style='color:#17a2b8;'>🌐 最新データを保存しました</span>";

      document.getElementById('status').innerHTML = 
        `✅ 登録完了: <b>${dataMap.size.toLocaleString()}件</b> (ユニーク) | ${cacheTag}<br>` +
        `<span style="font-size:12px; color:#666;">` +
        `総行数: ${totalRows.toLocaleString()}行 / 重複分: ${duplicateCount.toLocaleString()}件` +
        `</span>`;
    }

    // 手動更新ボタン用処理
    async function forceUpdateData() {
      if (!confirm("Googleスプレッドシートから最新データを再取得しますか？")) return;
      
      document.getElementById('status').innerText = "⏳ 最新データをダウンロード中...";
      document.getElementById('forceUpdateBtn').disabled = true;

      try {
        // キャッシュ回避パラメータを付与して強制フェッチ
        const res = await fetch(TSV_URL + "&t=" + new Date().getTime());
        const tsvText = await res.text();
        await saveTsv(tsvText);
        parseAndSetupData(tsvText, false);
        alert("データを最新に更新・保存しました！");
      } catch (err) {
        console.error(err);
        alert("データの更新に失敗しました。通信環境を確認してください。");
      } finally {
        document.getElementById('forceUpdateBtn').disabled = false;
      }
    }

    function startCamera() {
      html5Qrcode = new Html5Qrcode("reader");
      const config = { fps: 15, qrbox: { width: 220, height: 220 } };

      html5Qrcode.start(
        { facingMode: "environment" },
        config,
        function(decodedText) {
          document.getElementById('targetText').value = decodedText;
          searchAndDisplay(decodedText);
        },
        function(errorMessage) {}
      ).catch(function(err) {
        console.error("カメラエラー:", err);
        document.getElementById('status').innerText = "⚠️ カメラが起動できませんでした。";
      });
    }

    function manualSearch() {
      const inputEl = document.getElementById('targetText');
      const text = inputEl.value.trim();
      if(text === "") return;
      searchAndDisplay(text);
      inputEl.select();
    }

    function clearResult() {
      document.getElementById('targetText').value = '';
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('targetText').focus();
    }

    function buildUrlLink(val, eventCode) {
      if (!val || val === "-" || val === "未設定") {
        return "-";
      }
      const url = `https://bc.eplus.jp/events/${eventCode}/event/${eventCode}/tickets?search_key=${encodeURIComponent(val)}&status=&search_type_text=&event_id=&gate_pass_date_from=&gate_pass_date_to=&renkeimoto_code=&email_status=&tx_type_text=&receipt_method=&selected_tx_type_text_page=0`;
      return `<a href="${url}" target="_blank" rel="noopener noreferrer">${val} 🔗</a>`;
    }

    function formatMatchDate(val) {
      if (!val) return "未設定";
      if (val.includes("未定券1")) return "9/27（未定券1）";
      if (val.includes("未定券2")) return "10/3（未定券2）";
      if (val.includes("未定券3")) return "9/29（未定券3）";
      return val;
    }

    function searchAndDisplay(text) {
      const resultBox = document.getElementById('result-box');
      const resultMsg = document.getElementById('result-msg');
      const resultDetails = document.getElementById('result-details');
      
      const resDate = document.getElementById('res-date');
      const resCode = document.getElementById('res-code');
      const resName = document.getElementById('res-name');
      const resStaff = document.getElementById('res-staff');
      const resG = document.getElementById('res-g');
      const resI = document.getElementById('res-i');
      const resH = document.getElementById('res-h');

      resultBox.style.display = 'block';
      const data = dataMap.get(text);

      if (data) {
        resultMsg.innerHTML = '<div class="success-text">✅ 照合OK</div>';
        
        resDate.innerText = formatMatchDate(data.date);
        resCode.innerText = data.code || "未設定";
        resName.innerText = data.name || "未設定";
        resStaff.innerText = data.staff || "未設定";

        // 9/27: 有効
        resG.innerHTML = buildUrlLink(data.gVal, '090092-1407-001');

        // 9/29: 一時無効化（テキストのみ表示）
        resI.innerText = data.iVal;

        // 10/3: 一時無効化（テキストのみ表示）
        resH.innerText = data.hVal;

        resultDetails.style.display = 'block';
      } else {
        resultMsg.innerHTML = '<div class="error">❌ 該当データなし</div>';
        resultDetails.style.display = 'none';
      }
    }
  </script>
</body>
</html>
